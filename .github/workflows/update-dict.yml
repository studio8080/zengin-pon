# 金融機関辞書（data/）を zengin-code/source-data から毎週自動で更新し、差分があれば PR を作る。
# 元データの更新は不定期（1〜2か月おき）なので毎週見て、取り込みの遅れを短くする。差分が無い週は何もしない。
# マージすれば GitHub Pages に反映される（アプリ側の変更は不要）。
name: update-bank-dictionary

on:
  schedule:
    - cron: '0 22 * * 0'   # 毎週月曜 7:00 JST（10:00 の週次点検エージェントがこの PR も見る）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sitemap の lastmod を git の履歴から決めるため（浅い取得だと全ページが今日になる）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch source and read its last update date
        id: src
        run: |
          git clone https://github.com/zengin-code/source-data.git /tmp/source-data   # 統廃合の履歴を作るので全履歴を取る（約11MB）
          echo "date=$(git -C /tmp/source-data log -1 --format=%cs)" >> "$GITHUB_OUTPUT"
      - name: Build dictionary and bank pages
        run: |
          DICT_VERSION="${{ steps.src.outputs.date }}" node tools/build-dict.js /tmp/source-data
          node tools/build-history.js /tmp/source-data
          node tools/build-bank-pages.js
          node tools/build-site.js
      # この PR は GITHUB_TOKEN で作るので check-site が走らない。ここでテストを通してから PR にする
      - name: Test with the new dictionary
        run: |
          node test/zengin.test.js
          node test/organize.test.js
          node test/robust.test.js
          node test/dict.test.js
          node tools/build-site.js --check
      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: 金融機関辞書を ${{ steps.src.outputs.date }} 版に更新"
          title: "金融機関辞書の更新（${{ steps.src.outputs.date }} 版）"
          body: |
            zengin-code/source-data の ${{ steps.src.outputs.date }} 版を取り込みました。
            テスト（変換・自動整理・揺れ・照合）と `build-site.js --check` は通過済みです。
            統廃合があった場合は `data/merged.json` にも旧→新コードを追記してください。
            マージして GitHub Pages に反映されたら `node tools/indexnow.js --changed` を実行します。
          branch: auto/update-dict
          add-paths: |
            data/
            banks/
            sitemap.xml
