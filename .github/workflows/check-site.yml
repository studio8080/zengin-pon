# push のたびに、共通部品の埋め込み忘れとテストの失敗を検出する。
name: check-site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # sitemap の lastmod を git の履歴から出すため
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 変換エンジンと自動整理のテスト
        run: |
          node test/zengin.test.js
          node test/organize.test.js
          node test/functions.test.js
          node test/renew.test.js
          node test/sign.test.js
          node test/robust.test.js
          node test/dict.test.js
          node --test test/compare.test.js test/reader-fixtures.test.js test/banks.test.js
          node --check src/compare-ui.js
          node test/analytics.test.js
          node --test test/revenue.test.js
          mkdir -p /tmp/fb && node test/make-fb.js /tmp/fb && python3 tools/verify_zengin.py /tmp/fb/*.txt
      - name: 課金まわりの出荷前チェック（商品ID・更新先・CSP・メール文・キーの形式・秘密情報）
        run: node tools/preflight.mjs
      - name: 共通部品（ヘッダー・フッター・構造化データ）が全ページに埋め込まれているか
        run: node tools/build-site.js --check
